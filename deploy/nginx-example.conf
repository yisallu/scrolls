# nginx vhost for ShadowTV. Two things matter here and both are about media:
# buffering must be off (or nginx will try to spool a 2 GB video to disk before
# sending a byte), and the timeouts must be long enough for a slow upstream CDN.
#
# On a Cloudflare-proxied hostname, serve BOTH :80 and :443 even if the other
# vhosts on the box are :80-only — Cloudflare picks the origin port per hostname,
# and a hostname it decides to reach on :443 will otherwise land on whatever the
# default TLS vhost is (that mistake once produced a mystifying 401).

server {
    listen 80;
    listen [::]:80;
    server_name web.example.com;

    # If Cloudflare (or another CDN) terminates TLS in front, keep :80 working too.
    location / {
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # media proxying: stream through, never buffer
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4m;   # rule JSON uploads only
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.example.com;

    # Any valid cert on the box works when the CDN is in "Full (not strict)" mode;
    # use a real one for the hostname if clients reach the origin directly.
    ssl_certificate     /etc/letsencrypt/live/example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4m;
    }
}
