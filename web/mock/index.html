<!doctype html>
<meta charset="utf-8" />
<title>示例片库目录</title>
<style>body{font-family:sans-serif;background:#0c1014;color:#e9eff5;padding:24px}.v-card{display:inline-block;width:180px;margin:10px;vertical-align:top;color:inherit;text-decoration:none}.v-cover{width:180px;height:240px;object-fit:cover;border-radius:8px}.v-title{margin-top:6px;font-size:14px}</style>
<!--
  ShadowTV demo catalog — a deliberately plain, server-rendered page so the rule
  engine (cheerio) can parse it. The demo rule (data/rules/demo.json) reads:
    discover.list.item  = ".v-card"
    discover.list.title = ".v-title@text"
    discover.list.cover = ".v-cover@src"
    discover.list.url   = "@href"   (the card anchor itself)
-->
<h1>示例片库</h1>
<div class="catalog">
  <a class="v-card" href="/mock/bunny.html">
    <img class="v-cover" src="https://placehold.co/180x240/141a21/36e2a0?text=Big+Buck+Bunny" />
    <div class="v-title">Big Buck Bunny（MP4 测试）</div>
  </a>
  <a class="v-card" href="/mock/bipbop.html">
    <img class="v-cover" src="https://placehold.co/180x240/141a21/45b8f5?text=BipBop+HLS" />
    <div class="v-title">Apple BipBop（HLS 断句测试）</div>
  </a>
</div>
